name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types, architecture, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.32"
          enable-cache: true

      - name: Install the locked environment
        run: uv sync --locked --group dev

      - name: Lockfile is current
        run: uv lock --check

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Types
        run: uv run mypy

      - name: Architecture (DESIGN.md section 1 dependency table)
        run: uv run lint-imports

      - name: Tests
        run: |
          uv run pytest -m "not gpu and not network" \
            --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  evidence:
    name: committed evidence is append-only
    runs-on: ubuntu-24.04
    steps:
      # Full history: the gate diffs against the base, so a shallow clone
      # cannot see the record it is meant to protect.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base ref
        id: base
        run: |
          if [[ -n "${{ github.base_ref }}" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            echo "ref=origin/${{ github.base_ref }}" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
            echo "ref=origin/${{ github.event.repository.default_branch }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check append-only invariant
        run: python3 scripts/check_append_only.py "${{ steps.base.outputs.ref }}"

  image:
    name: docker image builds and runs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t counterscreen:ci .

      # The build environment that authored the Dockerfile had no Docker
      # daemon, so this job is the first place the image is proven.
      - name: Smoke test the entrypoint
        run: |
          docker run --rm counterscreen:ci version
          docker run --rm counterscreen:ci --help
