  # The single-residue discrimination in the published panel, and the one
  # structurally equivalent to this campaign: a point-mutant neoantigen
  # against its wild type, differing at one mid-peptide position. Its result
  # is reported separately from the panel aggregate (PROVENANCE.md).
  - name: CTNNB1-S5F
    allele: "A*03:01"
    target: CTNNB1 S5F
    on_target_peptide: TTAPFLSGK
    off_target_peptides:
      - {peptide: TTAPSLSGK, name: CTNNB1}
    source: "Liu et al. 2024 [R10], Supplementary Table 1"

  # --- The receptor from this campaign's own template.
  # Binds both the mutant and the wild-type complex (FINDINGS.md F-6), so it
  # is a positive control for engagement and weaker evidence for
  # discrimination. Chains D (203 aa) and E (246 aa) of 7OW6; the sequences
  # are obtainable from the deposited structure, but the control must be
  # folded from sequence like any design, never seeded from the pose.
  - name: 7OW6_TCR
    allele: "A*11:01"
    target: KRAS G12D
    on_target_peptide: VVVGADGVGK
    off_target_peptides:
      - {peptide: VVVGAGGVGK, name: KRAS wild type}
    source: "Poole et al., Nat Commun 2022 [R12], PDB 7OW6 chains D and E"
    seed_provenance: designed
    # The construct sequences from the deposition's own entity_poly record,
    # not the modelled coordinates: chain D resolves only 181 of its 203
    # residues, across three internal gaps (FINDINGS.md F-23). Folded from
    # sequence like any design; the pose is never handed to the model.
    binder_chains:
      - "AQKVTQAQTEISVVEKEDVTLDCVYETRDTAYYLFWYKQPPSGELVFLIRQPWWGEQNEISGRYSWNFQKSTSSFNFTITASQVVDSAVYFCAMSVPSGDGSYQFTFGKGTKLSVIPNIQNPDPAVYQLRDSKSSDKSVCLFTDFDSQTNVSQSKDSDVYITDKCVLDMRSMDFKSNSAVAWSNKSDFACANAFNNSIIPEDT"  # alpha, 203 aa
      - "MNAGVTQTPKFRVLKTGQSMTLLCAQDMNHEYMYWYRQDPGMGLRLIHYSVGEGTTAKGEVPDGYNVSRLKKQNFLLGLESAAPSQTSVYFCASKVGPGQHNSPLHFGNGTRLTVTEDLNKVFPPEVAVFEPSEAEISHTQKATLVCLATGFYPDHVELSWWVNGKEVHSGVCTDPQPLKEQPALNDSRYALSSRLRVSATFWQDPRNHFRCQVQFYGLSENDEWTQDRAKPVTQIVSAEAWGRAD"  # beta, 246 aa

# Supplementary single-residue controls, required by the floor arithmetic in
# PROVENANCE.md. Sources in SETUP.md 4.2: STCRDab and TCR3d give complete
# chains and documented specificity together, which VDJdb and IEDB do not.
#
# Each needs: the same binder tested against two peptides differing at exactly
# one position, an outcome recorded for each, and a full foldable sequence.
# Five are needed. Add them here as they are obtained.
supplementary: []

negatives:
  # Derived from the positives at run time by panel.negative_from, which needs
  # the binder sequences. Listed here only where a negative is not derived.
  []
