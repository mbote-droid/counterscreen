# The Stage -1 control panel, as data.
#
# PROTOCOL.md 5.0 makes this a blocking Day-1 task and SETUP.md 3.5 fixes what
# every control must record. PROVENANCE.md beside this file carries the
# narrative and the sources; this file is what the code reads, so the go/no-go
# in PREREGISTRATION.md 6b is computed from it rather than asserted in prose.
#
# Add a control by adding an entry. The floor recomputes, and
# tests/contract/test_control_catalogue.py reports the new state.
#
# Fields
#   name                 unique within the panel
#   role                 positive | negative | invariant_surface
#   allele               HLA allele the control is presented on
#   target               what the control is a binder for
#   on_target_peptide    the peptide it is meant to bind
#   off_target_peptides  list of {peptide, name}; the nearest one sets difficulty
#   binder_sequence      full chain, foldable. Omit when not yet obtained:
#                        a control without one cannot be folded and so cannot
#                        calibrate anything (FINDINGS.md F-16)
#   source               citation precise enough to find the value again
#   seed_provenance      designed | crystal. Must be `designed`: a control
#                        seeded from its deposited pose leaks the answer
#                        (PROTOCOL.md 5.2 rule 1), and validate_panel refuses
#                        a panel containing one
#   expected_gate        required on negatives: the gate it is registered to
#                        fail at (PROTOCOL.md 5.4)

positives:
